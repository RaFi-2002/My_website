<main>
  <section class="contact-form" style="background: var(--bg-card); padding: 2rem; border-radius: var(--radius-md); border: 1px solid var(--border);">
    <h2>Get in Touch</h2>
    <form action="https://formspree.io/f/mzzejjqa" method="POST">
      <div style="margin-bottom: 1rem;">
        <label for="name" style="display:block; font-weight:600; margin-bottom:0.3rem;">Name</label>
        <input id="name" name="name" type="text" required style="width:100%; padding:0.6rem; border:1px solid var(--border); border-radius:var(--radius-sm);" />
      </div>
      <div style="margin-bottom: 1rem;">
        <label for="email" style="display:block; font-weight:600; margin-bottom:0.3rem;">Email</label>
        <input id="email" name="email" type="email" required style="width:100%; padding:0.6rem; border:1px solid var(--border); border-radius:var(--radius-sm);" />
      </div>
      <div style="margin-bottom: 1rem;">
        <label for="message" style="display:block; font-weight:600; margin-bottom:0.3rem;">Message</label>
        <textarea id="message" name="message" rows="5" required style="width:100%; padding:0.6rem; border:1px solid var(--border); border-radius:var(--radius-sm);"></textarea>
      </div>
      <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Send Message</button>
    </form>
  </section>

  <section class="social-links" style="margin-top: 2.5rem;">
    <h3>Connect With Me</h3>
    <div class="social-icons">
      <a href="https://www.linkedin.com/in/rakibul-hasan-rafi-85457a3a5/" target="_blank" rel="noopener" class="social-link" aria-label="LinkedIn"><i class="fab fa-linkedin fa-2x"></i></a>
      <a href="https://github.com/RaFi-2002" target="_blank" rel="noopener" class="social-link" aria-label="GitHub"><i class="fab fa-github fa-2x"></i></a>
      <a href="https://www.researchgate.net/profile/Rakibul-Hasan-Rafi" target="_blank" rel="noopener" class="social-link" aria-label="ResearchGate"><i class="fab fa-researchgate fa-2x"></i></a>
      <a href="mailto:rafirock377@gmail.com" class="social-link" aria-label="Email"><i class="fas fa-envelope fa-2x"></i></a>
    </div>
  </section>
</main>
